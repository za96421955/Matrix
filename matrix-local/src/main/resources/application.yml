server:
  port: 8091

---
spring:
  application:
    name: matrix-local

  # 关闭 Nacos
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false

  # 数据源 - SQLite
  datasource:
    url: jdbc:sqlite:${user.dir}/matrix-local/data/matrix-local.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 600000

  # 自动初始化 schema
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-prefix: tbl_

---

matrix:
  client:
    name: PC
    desc: 个人办公
    basic:
      base-path: ${user.dir}
      settings-path: ${matrix.client.basic.base-path}/settings
      models-path: ${matrix.client.basic.settings-path}/models.yml
      risk-level-path: ${matrix.client.basic.settings-path}/risk-level.yml
      agent-path: ${matrix.client.basic.settings-path}/agent
      skill-path: ${matrix.client.basic.settings-path}/skill
      app-path: ${matrix.client.basic.settings-path}/app
  service:
    api-key: ${DEEPSEEK_API_KEY}
    retry-max: 5
    retry-base-delay: 1000
    base: http://localhost:8091
    register: /v1/client/register
    heartbeat: /v1/client/heartbeat
    ack: /v1/task/ack
  github:
    token: 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
